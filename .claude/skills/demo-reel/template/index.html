<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Demo reel</title>
<style>
  /* The product's fonts, installed from @fontsource so every render uses the same files. Swap them
     for the brand's own (npm install @fontsource/<font>) and list each weight film.js draws with. */
  @font-face { font-family: Inter; font-weight: 500; src: url(node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2); }
  @font-face { font-family: Inter; font-weight: 600; src: url(node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2); }
  @font-face { font-family: Inter; font-weight: 700; src: url(node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2); }
  @font-face { font-family: Inter; font-weight: 800; src: url(node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2); }
  html, body { margin: 0; background: #0b0c10; overflow: hidden; }
  canvas { display: block; }
  body:not(.render) canvas { max-height: 100vh; max-width: 100vw; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="timeline.js"></script>
<script src="lib.js"></script>
<script src="film.js"></script>
</body>
</html>
